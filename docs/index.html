<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Configurateur nanoKONTROL2 → ETC Eos</title>
<style>
:root{--bg:#16181c;--panel:#22252b;--panel2:#2b2f37;--line:#3a3f49;--text:#e8e9ec;--muted:#9aa0aa;--empty:#8f95a0;--accent:#e2a03f;--key:#3f8fe2;--cmd:#3fbf8a;--warn:#e2a03f;--err:#ff7a70;--ok:#5fd08f}
*{box-sizing:border-box}
body{margin:0;font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);padding-bottom:90px}
a{color:#8fc3ff}
.skip{position:absolute;left:8px;top:-60px;background:var(--accent);color:#1b1b1b;padding:8px 12px;border-radius:6px;font-weight:600;z-index:50}
.skip:focus{top:8px}
header{padding:18px 20px 4px}
h1{margin:0;font-size:1.3rem}
.steps{display:flex;flex-wrap:wrap;gap:8px 22px;margin:10px 0 0;padding:0;list-style:none;counter-reset:st}
.steps li{counter-increment:st;color:var(--muted);max-width:42ch;font-size:.9rem}
.steps li::before{content:counter(st);display:inline-flex;align-items:center;justify-content:center;width:1.5em;height:1.5em;border-radius:50%;background:var(--accent);color:#1b1b1b;font-weight:700;margin-right:6px;font-size:.85rem}
.steps b{color:var(--text)}
.help{font-size:.85rem;color:var(--muted);margin:8px 0 0}
main{display:grid;grid-template-columns:minmax(0,290px) minmax(0,1fr);gap:16px;padding:12px 20px 20px}
section{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;min-width:0}
@media(max-width:900px){main{grid-template-columns:minmax(0,1fr);padding:10px}#nano-section{order:-1}}
h2{font-size:.95rem;margin:0 0 10px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
h3{font-size:.85rem;margin:14px 0 6px;color:var(--muted)}
.lib{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:5px 9px;border-radius:6px;cursor:grab;user-select:none;font-size:.85rem;background:var(--panel2);border-left:4px solid var(--key)}
.chip.cmd{border-left-color:var(--cmd)}
.chip.sel{outline:3px solid var(--accent);background:#3a3326}
.chip small{display:block;color:var(--muted);font-size:.72rem}
.chip.alt{border-left-style:dashed;background:#252830;margin-left:14px;flex-basis:calc(100% - 14px)}
.chip.alt::before{content:"↳ ";color:var(--muted)}
.gnote{font-size:.78rem;color:var(--warn);margin:6px 0 0}
form.custom{display:grid;gap:4px;margin-top:6px}
form.custom label{font-size:.8rem;color:var(--muted);margin-top:4px}
input,select,button{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
input[type=number]{width:5.5em}
button{cursor:pointer}
button.primary{background:var(--accent);color:#1b1b1b;border:none;font-weight:600}
button.link{background:none;border:none;color:#8fc3ff;text-decoration:underline;padding:4px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.legend{display:flex;gap:14px;font-size:.8rem;color:var(--muted);flex-wrap:wrap}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.legend .k::before{background:var(--key)} .legend .c::before{background:var(--cmd)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.bar label,.bar .bl{font-size:.85rem;color:var(--muted)}
.empty-state{border:1px dashed var(--accent);border-radius:10px;padding:12px 14px;margin-bottom:12px;background:#2a2620}
.empty-state p{margin:0 0 8px}
.empty-state .bar{margin:0}
.scrollhint{display:none;font-size:.8rem;color:var(--muted);margin:0 0 6px}
@media(max-width:1060px){.scrollhint{display:block}}
.nanowrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.nano{display:flex;gap:18px;min-width:1000px;background:#0d0e10;border-radius:14px;padding:18px;border:1px solid #000}
.left{display:grid;gap:12px;width:390px;flex:none;align-content:space-between}
.row{display:flex;gap:8px;align-items:flex-end}
.target{flex:1 1 0;min-width:0;min-height:62px;overflow-wrap:anywhere;border:1px dashed #5a606b;border-radius:8px;padding:4px 6px;background:repeating-linear-gradient(135deg,#15171a 0 6px,#1a1c20 6px 12px);display:flex;flex-direction:column;justify-content:space-between;cursor:pointer}
.target .hw{font-size:.7rem;color:var(--muted)}
.target .fn{font-size:.76rem;font-weight:600;line-height:1.15}
.target.key{border:2px solid var(--key);background:rgba(63,143,226,.22)} .target.cmd{border:2px solid var(--cmd);background:rgba(63,191,138,.22)}
.target .fn.empty{font-weight:400;font-style:italic;color:var(--empty)}
.target.key .fn,.target.cmd .fn{color:#fff}
.target.over,.slot.over{background:#33383f;border-color:var(--accent)}
.spacer{flex:1 1 0}
.strips{display:flex;gap:8px;flex:1}
.strip{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:6px;align-items:center;background:#15171a;border:1px solid #2a2d33;border-radius:8px;padding:8px 4px 6px;cursor:pointer}
.strip:hover{border-color:#555b66}
.strip.active{border-color:var(--accent);background:#1d1b17}
.strip .cfg{margin-top:auto;font-size:.68rem;color:var(--muted);border-top:1px solid #2a2d33;width:100%;text-align:center;padding-top:4px}
.strip.active .cfg,.strip:hover .cfg{color:var(--accent)}
.knob{width:34px;height:34px;border-radius:50%;background:#2c2f35;border:2px solid #444;flex:none}
.t-fader{--tc:#3fbf6a}.t-sub{--tc:#e2c23f}.t-chan{--tc:#e2574c}.t-rel{--tc:#3fc6e2}.t-none{--tc:#5a606b}
.knob.t-fader,.knob.t-sub,.knob.t-chan,.knob.t-rel{border:3px solid var(--tc);box-shadow:0 0 0 3px color-mix(in srgb,var(--tc) 22%,transparent)}
.knob.t-none{border:2px dashed #5a606b;background:transparent}
.fader{width:8px;height:70px;background:#333;border-radius:4px;position:relative;margin:4px 0;flex:none}
.fader::after{content:"";position:absolute;left:-9px;top:30px;width:26px;height:14px;background:#555;border-radius:3px}
.fader.t-fader,.fader.t-sub,.fader.t-chan{background:color-mix(in srgb,var(--tc) 45%,#222)}
.fader.t-fader::after,.fader.t-sub::after,.fader.t-chan::after{background:var(--tc)}
.fader.t-none{background:transparent;border:1px dashed #5a606b}
.lbl{font-size:.66rem;color:var(--muted);text-align:center;line-height:1.2;min-height:2.4em;overflow-wrap:anywhere}
.lbl.set{color:#fff;font-weight:600;font-size:.7rem;border-bottom:2px solid var(--tc)}
.lbl.kset{background:#262a31;border-radius:4px;padding:2px 3px}
.lbl.empty{font-style:italic;color:var(--empty)}
.slot{width:100%;min-height:24px;border-radius:4px;background:#2c2f35;border:1px solid transparent;border-left:4px solid var(--bc,#555);font-size:.64rem;text-align:center;line-height:1.1;padding:3px 2px;overflow-wrap:anywhere;cursor:pointer}
.slot.b-none{border:1px dashed #5a606b;background:transparent;color:var(--empty);font-style:italic}
.slot.na{opacity:.6;text-decoration:line-through;border-left-style:dashed}
.slot:hover{background:#353a42}
.slot b{color:var(--accent)}
.b-full{--bc:#ffffff}.b-out{--bc:#a3a9b3}.b-flash{--bc:#f28c28}.b-fire{--bc:#4a7bff}.b-stop{--bc:#9b5de5}.b-load{--bc:#ff6fb5}.b-home{--bc:#c8a97e}.b-sel{--bc:#d63cff}.b-fn{--bc:#b9c0ff}.b-none{--bc:#5a606b}
.tlegend,.blegend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:.75rem;color:var(--muted);margin-top:8px}
.tlegend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px;background:var(--tc)}
.blegend span{border-left:4px solid var(--bc);padding-left:5px}
#rowbar select{min-width:9em;max-width:13em}
.bar select{max-width:100%}
#rowbar .rl{font-weight:600;color:var(--accent);margin-left:6px;display:inline-block;width:1.3em}
/* mode "toucher puis toucher" : les zones de depot pulsent */
body.picking .target,body.picking .slot{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 3px var(--accent)}}
@media(prefers-reduced-motion:reduce){body.picking .target,body.picking .slot{animation:none;box-shadow:0 0 0 2px var(--accent)}}
.pop{position:absolute;z-index:20;background:var(--panel);border:1px solid var(--accent);border-radius:8px;padding:10px;width:260px;box-shadow:0 8px 24px #000a}
.pop h4{margin:0 0 6px;font-size:.85rem}
.pop .opts{display:grid;gap:4px}
.pop button.o{text-align:left;border-left:4px solid var(--bc,#555);padding:6px 8px;font-size:.82rem}
.pop button.o[disabled]{opacity:.45;cursor:not-allowed}
.pop button.o small{display:block;font-size:.7rem;color:var(--muted)}
.pop button.o.cur{outline:2px solid var(--accent)}
.pop select{width:100%;margin-top:6px;font-size:.82rem}
.pop label{display:flex;gap:6px;align-items:center;font-size:.82rem;margin-top:8px}
.pop .close{position:absolute;right:6px;top:4px;background:none;border:none;font-size:1.1rem;padding:2px 8px}
#editor{margin-top:14px;background:var(--panel2);border-radius:8px;padding:12px;display:none;border:1px solid var(--accent)}
#editor.open{display:block}
#editor .hd{display:flex;justify-content:space-between;align-items:center;gap:8px}
#editor .hd h2{margin:0;color:var(--text)}
#editor .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-top:10px}
#editor fieldset{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:0}
#editor legend{font-size:.8rem;color:var(--muted);padding:0 4px}
#editor .f{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:6px 0}
#editor .f > span{font-size:.82rem;color:var(--muted);min-width:7.5em}
#editor .sent{font-size:.75rem;color:var(--muted);margin:6px 0 0;overflow-wrap:anywhere}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;align-items:center}
.actions .sep{flex:1}
.saved{font-size:.8rem;color:var(--muted);transition:color .3s}
.saved.flash{color:var(--ok)}
.saved.bad{color:var(--err)}
.note{color:var(--muted);font-size:.82rem;margin-top:10px}
#done{display:none;margin-top:12px;border:1px solid var(--ok);border-radius:8px;padding:10px 14px;background:#1c2a22}
#done.show{display:block}
#done h3{margin:0 0 6px;color:var(--ok);font-size:.95rem}
#done ol{margin:0;padding-left:20px;font-size:.88rem}
#rules{margin:12px 0 0;padding-left:18px;font-size:.85rem}
#rules li.err{color:var(--err)} #rules li.warn{color:var(--warn)} #rules li.info{color:var(--muted)}
code{background:#000;padding:1px 4px;border-radius:4px}
/* barres flottantes en bas : mode selection + notifications */
.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:12px;z-index:40;display:grid;gap:8px;width:min(560px,calc(100% - 20px))}
.pickbar,.toast{display:none;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;border-radius:10px;box-shadow:0 6px 24px #000c;font-size:.9rem}
.pickbar{background:#3a3326;border:1px solid var(--accent)}
.toast{background:#2b2f37;border:1px solid var(--line)}
.pickbar.show,.toast.show{display:flex}
.pickbar span,.toast span{flex:1;min-width:12em}
.pickbar button,.toast button{padding:6px 12px}
@media(pointer:coarse){
  .chip,.slot,button,select,input{min-height:44px}
  .slot{display:flex;align-items:center;justify-content:center}
  .chip{display:flex;flex-direction:column;justify-content:center}
}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.lang{font-size:.85rem;padding:5px 12px}
.topr{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.bmc{font-size:.85rem;padding:5px 12px;border:1px solid var(--accent);border-radius:6px;color:var(--accent);text-decoration:none;white-space:nowrap}
.bmc:hover{background:var(--accent);color:#1b1b1b}
@media(pointer:coarse){.bmc{min-height:44px;display:inline-flex;align-items:center}}
</style>
</head>

function presetStrips(kind,start){
  const s=Math.max(1,parseInt(start)||1), faders=[], knobs=[], smr=[];
  for(let i=0;i<8;i++){
    if(kind==="wing"){ faders.push({t:"fader",n:i+1}); }
    else faders.push({t:kind==="subs"?"sub":"chan",n:s+i});
    const d=BEH_DEFAULT[faders[i].t]; smr.push({S:{b:d[0]},M:{b:d[1]},R:{b:d[2]}});
  }
  if(kind==="wing"){
    knobs.push({m:"rel",p:"intens",w:"coarse",k:1},{m:"rel",p:"pan",w:"coarse",k:10},{m:"rel",p:"pan",w:"coarse",k:1},
               {m:"rel",p:"tilt",w:"coarse",k:5},{m:"rel",p:"tilt",w:"coarse",k:1},{m:"rel",p:"zoom",w:"coarse",k:3},
               {m:"fader",n:9},{m:"fader",n:10});
  } else for(let i=0;i<8;i++) knobs.push({m:kind==="subs"?"sub":"chan",n:s+8+i});
  return {faders,knobs,smr};
}
function defaultCfg(){ return Object.assign({buttons:{...DEFAULT_BUTTONS},custom:[]},presetStrips("wing",1)); }

  smr:Array.from({length:8},()=>({S:{...n},M:{...n},R:{...n}}))}; }

let undoSnap=null, toastTimer=null;
function toast(msg,action){
  const tt=document.getElementById("toast"), m=document.getElementById("toastmsg");
  tt.querySelectorAll("button").forEach(b=>b.remove()); m.textContent=msg; tt.classList.add("show");
  if(action){ const b=document.createElement("button"); b.type="button"; b.textContent=action.label; b.onclick=()=>{ action.fn(); }; tt.append(b); }
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>tt.classList.remove("show"),action?8000:3500);
}
// action destructive : on garde l'etat precedent et on propose "Annuler"
function undoable(msg,mutate){
  undoSnap=JSON.stringify(cfg); mutate(); changedAll();
  toast(msg,{label:t("undo"),fn:()=>{ if(!undoSnap) return; cfg=JSON.parse(undoSnap); undoSnap=null; openStrip=null; changedAll(); toast(t("undone")); }});
}

// ---------- rendu ----------
function chip(f){
  const el=document.createElement("div"); el.className="chip "+f.type; el.draggable=true; el.tabIndex=0; el.dataset.id=f.id;
  el.setAttribute("role","button"); el.setAttribute("aria-pressed",selected===f.id?"true":"false");
  if(f.alt) el.classList.add("alt");
  el.append(fnLabel(f));
  const sm=document.createElement("small"); sm.textContent=L(f.d)||((f.type==="cmd"?t("chip_cmd"):t("chip_osc"))+f.value); el.append(sm);
  el.title=(f.type==="cmd"?t("chip_cmd"):t("chip_osc"))+f.value;
  el.addEventListener("dragstart",e=>e.dataTransfer.setData("text/plain","fn:"+f.id));
  const pick=()=>setPick(selected===f.id?null:f.id);
  el.addEventListener("click",pick);
  el.addEventListener("keydown",e=>{ if(e.key==="Enter"||e.key===" "){e.preventDefault();pick();} });
  if(selected===f.id) el.classList.add("sel");
  return el;
}
function renderLib(){
  const fid=document.activeElement&&document.activeElement.classList.contains("chip")?document.activeElement.dataset.id:null;

  GROUPS.forEach(g=>{
    const h=document.createElement("h3"); h.textContent=t("g_"+g); const l=document.createElement("div"); l.className="lib";
    l.append(...LIB.filter(f=>f.g===g).map(chip)); box.append(h,l);
    if(GROUP_NOTE[g]){ const n=document.createElement("p"); n.className="gnote"; n.textContent=t(GROUP_NOTE[g]); box.append(n); }
  });
  document.getElementById("lib-custom").replaceChildren(...cfg.custom.map(chip));
  if(fid){ const c=document.querySelector('.chip[data-id="'+fid+'"]'); if(c) c.focus(); }
}

function renderStrips(){

    kn.title=t("knob_title",i+1,(km==="rel"?t("knob_wheel"):"")+knobLabel(cfg.knobs[i]));
    const kl=document.createElement("div"); kl.className="lbl t-"+km+(km==="none"?" empty":" set kset"); kl.textContent=knobLabel(cfg.knobs[i]);
    s.append(kn,kl);
    for(const slot of ["S","M","R"]){
      const cur=cfg.smr[i][slot], ok=available(i,cur.b);
      const b=document.createElement("div"); b.className="slot b-"+cur.b+(ok?"":" na"); b.dataset.strip=i; b.dataset.slot=slot; b.tabIndex=0;

      b.title=ok?t("slot_title",slot,i+1,behLabel(i,slot)):t("slot_na",behName(cur.b,"fader"),t("tn_"+cfg.faders[i].t));

// ---------- regles ----------
function checkRules(){
  const out=[], seen={};
  const reg=(key,where)=>{ (seen[key]=seen[key]||[]).push(where); };
  cfg.faders.forEach((f,i)=>{ if(f.t!=="none") reg(f.t+":"+f.n,t("w_fader",i+1)); });
  cfg.knobs.forEach((k,i)=>{ if(k.m!=="rel"&&k.m!=="none") reg(k.m+":"+k.n,t("w_knob",i+1)); });
  for(const k in seen) if(seen[k].length>1){ const [ty,n]=k.split(":"); out.push(["warn",t("r_dup",targetLabel(ty,n),seen[k].join(", "))]); }
  cfg.knobs.forEach((k,i)=>{ if(k.m==="rel"&&!k.p) out.push(["err",t("r_param",i+1)]); });
  const usesBank=cfg.faders.some(f=>f.t==="fader")||cfg.knobs.some(k=>k.m==="fader");
  const vals=Object.values(cfg.buttons);
  const pg=["pageup","pagedown"];
  if(usesBank && !pg.some(x=>vals.includes(x))) out.push(["info",t("r_tip")]);
  if(pg.some(x=>vals.includes(x))&&!pg.every(x=>vals.includes(x))) out.push(["warn",t("r_pair")]);
  if(pg.some(x=>vals.includes(x))) out.push(["info",t("r_pages")]);
  if(!usesBank && pg.some(x=>vals.includes(x))) out.push(["warn",t("r_nobank")]);
  cfg.smr.forEach((s,i)=>["S","M","R"].forEach(sl=>{
    if(s[sl].b==="fn"&&!fnById(s[sl].id)) out.push(["err",t("r_missing",sl,i+1)]);
    else if(!available(i,s[sl].b)) out.push(["warn",t("r_na",sl,i+1,behName(s[sl].b,"fader"),t("tn_"+cfg.faders[i].t))]); }));
  const ul=document.getElementById("rules"); ul.replaceChildren(...out.map(([c,txt])=>{ const li=document.createElement("li"); li.className=c; li.textContent=(c==="err"?t("r_err"):"")+txt; return li; }));
  return out;
}

// ---------- generation Chataigne (noms toujours en francais, comme le projet du depot) ----------
const clone=o=>JSON.parse(JSON.stringify(o));
const midi=cc=>"/modules/midi/values/_1_CC"+cc;
// noms ASCII uniquement (Chataigne derive des adresses internes des noms)
const ascii=x=>String(x).normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/×/g,"x").replace(/[−–—]/g,"-").replace(/[^\x20-\x7E]/g,"");
function keyAction(name,cc,addr){ const a=clone(TPL.keyAction); a.niceName=ascii(name); a.conditions.items[0].parameters[0].value=midi(cc); a.consequences.items[0].command.parameters[0].value=addr; return a; }
function cmdAction(name,cc,text){ const a=clone(TPL.cmdAction); a.niceName=ascii(name); a.conditions.items[0].parameters[0].value=midi(cc);
  const arg=a.consequences.items[0].command.argManager.items[0]; arg.parameters[0].value=text; arg.param.value=text; return a; }
function flashAction(name,cc,addr){ const a=clone(TPL.flashAction); a.niceName=ascii(name); a.conditions.items[0].parameters[0].value=midi(cc);
  a.consequences.items[0].command.parameters[0].value=addr; a.consequencesOff.items[0].command.parameters[0].value=addr; return a; }
function fnAction(name,cc,f){
  if(f.multi){ const a=keyAction(name,cc,f.multi[0]); const c0=a.consequences.items[0];
    a.consequences.items=f.multi.map((addr,i)=>{ const c=clone(c0); c.niceName="Consequence "+(i+1); c.command.parameters[0].value=addr; return c; }); return a; }
  return f.type==="key"?keyAction(name,cc,f.value):cmdAction(name,cc,f.value); }
function mapping(name,cc,ty,n){
  const m=clone(TPL.mapping); m.niceName=ascii(name); m.im.items[0].parameters[0].value=midi(cc);
  const tg=m.filters.items[0].filterParams.parameters.find(p=>p.controlAddress==="/targetMin_Max");
  tg.value=ty==="chan"?[0.0,100.0]:[0.0,1.0];
  m.outputs.items[0].command.parameters[0].value=faderAddr(ty,n);
  return m;
}
function smrAction(i,slot){
  const b=cfg.smr[i][slot], cc=CC[slot](i), fa=cfg.faders[i], name=slot+(i+1)+" - ";
  if(b.b==="none"||!available(i,b.b)) return null;
  if(b.b==="fn"){ const f=fnById(b.id); return f?fnAction(name+fnLabel(f,"fr"),cc,f):null; }
  const lab=name+behName(b.b,fa.t,"fr").toUpperCase()+" "+targetLabel(fa.t,fa.n,"fr").toUpperCase();
  if(fa.t==="fader"){ const base="/eos/fader/1/"+fa.n; return b.b==="flash"?flashAction(lab,cc,base+"/fire"):keyAction(lab,cc,base+"/"+b.b); }
  if(fa.t==="sub"){ const base="/eos/sub/"+fa.n; return b.b==="flash"?flashAction(lab,cc,base+"/fire"):keyAction(lab,cc,base+"/"+b.b); }
  if(fa.t==="chan"){ return cmdAction(lab,cc,b.b==="full"?"Chan "+fa.n+" Full #":b.b==="out"?"Chan "+fa.n+" Out #":"Chan "+fa.n+" #"); }
  return null;
}
// position et taille dans la State Machine (meme disposition que le projet du depot)
function state(name,x,y,w,items){ const s=clone(TPL.state); s.niceName=name;
  const set=(addr,v)=>{ const q=s.parameters.find(p=>p.controlAddress===addr); if(q) q.value=v; else s.parameters.push({value:v,controlAddress:addr}); };
  set("/viewUIPosition",[x,y]); set("/viewUISize",[w,Math.max(96,60+items.length*28)]);
  s.processors.items=items; return s; }

function buildScript(){
  const rel=cfg.knobs.map((k,i)=>({k,i})).filter(o=>o.k.m==="rel"); if(!rel.length) return null;
  let s="// Genere par le configurateur nanoKONTROL2 -> ETC Eos\n// Potards en roue : crans de roue Eos par cran de potard (negatif = sens inverse).\n";
  rel.forEach(o=>{ s+="var last"+CC.knob(o.i)+" = -1;\n"; });
  s+="\nfunction step(last, value) { return (last >= 0) ? value - last : 0; }\nfunction wheel(address, ticks) { if (ticks != 0) root.modules.osc.send(address, ticks); }\n\nfunction ccEvent(channel, number, value) {\n";
  rel.forEach((o,j)=>{ const cc=CC.knob(o.i), k=o.k, addr=k.p==="intens"?"/eos/wheel/level":"/eos/wheel/"+k.w+"/"+k.p;
    s+="  "+(j?"} else ":"")+"if (number == "+cc+") {   // potard "+(o.i+1)+" : "+ascii(knobLabel(k,"fr"))+"\n    wheel(\""+addr+"\", step(last"+cc+", value) * "+k.k+");\n    last"+cc+" = value;\n"; });
  s+="  }\n}\n"; return s;
}
function buildProject(){
  const p=clone(TPL.project), script=buildScript();
  const faders=[], smr=[], keys=[];
  cfg.faders.forEach((f,i)=>{ if(f.t!=="none") faders.push(mapping("FADER "+(i+1)+" - "+targetLabel(f.t,f.n,"fr").toUpperCase(),CC.fader(i),f.t,f.n)); });
  cfg.knobs.forEach((k,i)=>{ if(k.m!=="rel"&&k.m!=="none") faders.push(mapping("POTARD "+(i+1)+" - "+targetLabel(k.m,k.n,"fr").toUpperCase(),CC.knob(i),k.m,k.n)); });
  for(let i=0;i<8;i++) for(const sl of ["S","M","R"]){ const a=smrAction(i,sl); if(a) smr.push(a); }
  // boutons dans l'ordre physique du nano : Track, Cycle / Set / Marker, transport
  BTN_ORDER.forEach(cc=>{ const f=fnById(cfg.buttons[cc]); if(f&&!f.script) keys.push(fnAction(BTN_NAME[cc]+" - "+fnLabel(f,"fr"),cc,f)); });
  p.states.items.push(state("TOUCHES NANO > EOS",-1010,-474,452,keys),state("FADERS",-548,-474,456,faders),state("S / M / R",-82,-474,445,smr));
  p.modules.items.forEach(m=>{ if(m.type==="MIDI"&&m.scripts&&m.scripts.items){
    if(script){ m.scripts.items.forEach(sc=>{ sc.niceName="encodeurs-relatifs"; sc.parameters.forEach(q=>{ if(q.controlAddress==="/filePath") q.value="encodeurs-relatifs.js"; }); }); }
    else m.scripts.items=[]; } });
  return {project:p,script,count:faders.length+smr.length+keys.length};
}

// ---------- zip (sans compression, sans bibliotheque) ----------
const CRC_T=(()=>{ const x=new Uint32Array(256); for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c=c&1?0xEDB88320^(c>>>1):c>>>1; x[n]=c>>>0; } return x; })();
function crc32(b){ let c=0xFFFFFFFF; for(let i=0;i<b.length;i++) c=CRC_T[(c^b[i])&255]^(c>>>8); return (c^0xFFFFFFFF)>>>0; }
function makeZip(files){
  const enc=new TextEncoder(), parts=[], central=[]; let off=0;
  const d=new Date(), time=(d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1), date=((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate();
  for(const f of files){
    const name=enc.encode(f.name), data=enc.encode(f.text), crc=crc32(data);
    const h=new DataView(new ArrayBuffer(30));
    h.setUint32(0,0x04034b50,true); h.setUint16(4,20,true); h.setUint16(6,0x0800,true); h.setUint16(8,0,true); h.setUint16(10,time,true); h.setUint16(12,date,true);
    h.setUint32(14,crc,true); h.setUint32(18,data.length,true); h.setUint32(22,data.length,true); h.setUint16(26,name.length,true); h.setUint16(28,0,true);
    parts.push(h,name,data);
    const c=new DataView(new ArrayBuffer(46));
    c.setUint32(0,0x02014b50,true); c.setUint16(4,20,true); c.setUint16(6,20,true); c.setUint16(8,0x0800,true); c.setUint16(10,0,true); c.setUint16(12,time,true); c.setUint16(14,date,true);
    c.setUint32(16,crc,true); c.setUint32(20,data.length,true); c.setUint32(24,data.length,true); c.setUint16(28,name.length,true); c.setUint32(42,off,true);
    central.push(c,name); off+=30+name.length+data.length;
  }
  const size=central.reduce((s,x)=>s+x.byteLength,0), e=new DataView(new ArrayBuffer(22));
  e.setUint32(0,0x06054b50,true); e.setUint16(8,files.length,true); e.setUint16(10,files.length,true); e.setUint32(12,size,true); e.setUint32(16,off,true);
  return new Blob([...parts,...central,e],{type:"application/zip"});
}
function readme(hasScript){ return I18N[LANG].readme.join("\r\n").split("{0}").join(hasScript?t("readme_s"):"").split("{1}").join(HELP_URL()); }
function download(name,data,type){ const blob=data instanceof Blob?data:new Blob([data],{type}); const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; document.body.append(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),2000); }
function exportProject(){
  const errs=checkRules().filter(r=>r[0]==="err");
  if(errs.length){ toast(t("exp_blocked",errs.length)); document.getElementById("rules").scrollIntoView({behavior:"smooth",block:"center"}); return; }
  const r=buildProject(), dir="nanoKONTROL2-EOS/";
  const files=[{name:dir+"nanoKONTROL2-EOS.noisette",text:JSON.stringify(r.project)},{name:dir+"nanokontrol2-config.json",text:JSON.stringify(cfg,null,1)},{name:dir+t("readme_name"),text:readme(!!r.script)}];
  if(r.script) files.splice(1,0,{name:dir+"encodeurs-relatifs.js",text:r.script});
  download("nanoKONTROL2-EOS.zip",makeZip(files));
  const d=document.getElementById("done");
  d.innerHTML="<h3>"+t("done_title",r.count)+"</h3><ol><li>"+t("done_1",r.script?t("done_1s"):"")+"</li><li>"+t("done_2")+"</li><li>"+t("done_3")+"</li><li>"+t("done_4",HELP_URL())+"</li></ol>";
  d.classList.add("show"); d.focus();
}

// ---------- evenements ----------
function updateCustomValue(){ const v=document.getElementById("c-type").value;
  document.getElementById("c-value-l").textContent=t("cv_"+v); document.getElementById("c-value").placeholder={macro:"5",key:"/eos/key/...",cmd:"Macro 5 #"}[v]; }
document.getElementById("c-type").addEventListener("change",updateCustomValue);
document.getElementById("custom-form").addEventListener("submit",e=>{
  e.preventDefault(); const ty=document.getElementById("c-type").value; let v=document.getElementById("c-value").value.trim();
  const label=document.getElementById("c-label").value.trim().toUpperCase(); if(!label||!v) return;
  let f;
  if(ty==="macro"){ const n=parseInt(v); if(!(n>0)){ toast(t("cf_macro_err")); return; } f={type:"key",value:"/eos/macro/"+n+"/fire"}; }
  else if(ty==="key"){ if(!v.startsWith("/")){ toast(t("cf_osc_err")); return; } f={type:"key",value:v}; }
  else f={type:"cmd",value:v};
  Object.assign(f,{id:"c"+Date.now(),label,custom:1}); cfg.custom.push(f); store.save(); renderLib(); renderRowbar(); e.target.reset(); updateCustomValue();
  toast(t("cf_added",label));
});
function applyPreset(k,st){ undoable(t("preset_done",t("preset_"+k)),()=>{ Object.assign(cfg,presetStrips(k,st)); if(k==="wing"&&!Object.keys(cfg.buttons).length) cfg.buttons={...DEFAULT_BUTTONS}; openStrip=null; }); }
document.getElementById("apply-preset").onclick=()=>applyPreset(document.getElementById("preset").value,document.getElementById("preset-start").value);
document.querySelectorAll("#empty [data-preset]").forEach(b=>b.onclick=()=>applyPreset(b.dataset.preset,1));
document.getElementById("export").onclick=exportProject;
document.getElementById("save-cfg").onclick=()=>{ download("nanokontrol2-config.json",JSON.stringify(cfg,null,1),"application/json"); toast(t("saved_file")); };
document.getElementById("load-cfg-btn").onclick=()=>document.getElementById("load-cfg").click();
document.getElementById("load-cfg").onchange=e=>{ const f=e.target.files[0]; if(!f) return; const r=new FileReader();
  r.onload=()=>{ try{ const c=JSON.parse(r.result); if(!c.faders||!c.knobs||!c.smr||!c.buttons) throw 0; undoable(t("opened",f.name),()=>{ cfg=c; cfg.custom=cfg.custom||[]; openStrip=null; }); }
    catch(x){ toast(t("bad_file",f.name)); } };
  r.readAsText(f); e.target.value=""; };
document.getElementById("blank").onclick=()=>undoable(t("cleared"),()=>{ cfg=blankCfg(); openStrip=null; });
document.getElementById("reset").onclick=()=>undoable(t("reset_done"),()=>{ const c=cfg.custom; cfg=defaultCfg(); cfg.custom=c||[]; openStrip=null; });
document.getElementById("lang").onclick=()=>setLang(LANG==="fr"?"en":"fr");

store.load(); applyStatic(); initButtons(); changedAll(); document.getElementById("saved").classList.remove("flash");
</script>
