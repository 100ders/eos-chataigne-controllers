let LANG = (()=>{ const q=new URLSearchParams(location.search).get("lang"); if(q==="fr"||q==="en") return q;
  try{ const s=localStorage.getItem("nano-eos-lang"); if(s==="fr"||s==="en") return s; }catch(e){}
  return (navigator.language||"fr").toLowerCase().startsWith("fr")?"fr":"en"; })();
// t() : interface ; tf() : toujours en francais (noms du projet Chataigne exporte)
function tl(lang,k,...a){ let s=I18N[lang][k]; if(s===undefined) s=I18N.fr[k]; if(s===undefined) return k; a.forEach((v,i)=>{ s=s.split("{"+i+"}").join(v); }); return s; }
const t=(k,...a)=>tl(LANG,k,...a), tf=(k,...a)=>tl("fr",k,...a);
// pluriel : cle_one / cle_other selon le nombre (premier argument)
const tn=(k,n,...a)=>t(k+(n===1?"_one":"_other"),n,...a);
const L=(x,lang=LANG)=>(x&&typeof x==="object")?(x[lang]||x.fr):x;   // texte bilingue {fr,en} ou simple
const HELP_URL=()=>REPO+"/blob/main/docs/eos-osc-setup"+(LANG==="en"?".en":"")+".md";
const OSC_DICT="https://www.etcconnect.com/WebDocs/Controls/EosFamilyOnlineHelp/en/Content/22_Show_Control/08_OSC/OSC_Dictionary.htm";
const NANO_URL=()=>REPO+"/blob/main/nanokontrol2/README"+(LANG==="en"?".en":"")+".md";

// etat de l'interface : legende ouverte, etapes affichees (memorise dans le navigateur)
const ui=(()=>{ try{ return Object.assign({legend:false,steps:true,settings:true},JSON.parse(localStorage.getItem("nano-eos-ui")||"{}")); }catch(e){ return {legend:false,steps:true,settings:true}; } })();
function applyUI(){
  document.getElementById("legends").hidden=!ui.legend; document.getElementById("steps").hidden=!ui.steps;
  const lb=document.getElementById("legend-btn"); lb.textContent=t(ui.legend?"legend_hide":"legend_show"); lb.setAttribute("aria-expanded",ui.legend?"true":"false");
  // case Reglages : depliee = tout ; repliee = resume d'une ligne
  document.getElementById("set-body").hidden=!ui.settings; document.getElementById("legend-btn").hidden=!ui.settings;
  document.getElementById("set-section").classList.toggle("folded",!ui.settings); document.getElementById("set-summary").hidden=ui.settings;
  const fb=document.getElementById("set-btn"); fb.textContent=t(ui.settings?"set_fold":"set_unfold"); fb.setAttribute("aria-expanded",ui.settings?"true":"false");
  renderSummary();
  const sb=document.getElementById("steps-btn"); sb.textContent=t(ui.steps?"steps_hide":"steps_show"); sb.setAttribute("aria-expanded",ui.steps?"true":"false");
}
// resume des reglages, affiche quand la case est repliee
function renderSummary(){
  const el=document.getElementById("set-summary"); if(!el||ui.settings) return;
  const ft=[...new Set(cfg.faders.map(f=>f.t))], fn=cfg.faders.map(f=>f.n);
  const fad=ft.length>1?t("sum_mixed"):ft[0]==="none"?t("free"):targetLabel(ft[0],Math.min(...fn))+(Math.max(...fn)>Math.min(...fn)?"–"+Math.max(...fn):"");
  const wheels=cfg.knobs.filter(k=>k.m==="rel").length;
  const smr=["S","M","R"].map(sl=>{ const v=cfg.smr.map(x=>x[sl].b==="fn"?"fn:"+x[sl].id:x[sl].b); return sl+" "+(v.every(x=>x===v[0])?valLabel(v[0],"fader"):t("row_diff")); }).join(" · ");
  el.textContent=t("set_summary",fad,wheels,smr);
}
function toggleUI(k){ ui[k]=!ui[k]; try{ localStorage.setItem("nano-eos-ui",JSON.stringify(ui)); }catch(e){} applyUI(); }
function applyStatic(){
  document.documentElement.lang=LANG; document.title=t("title");
  document.querySelectorAll("[data-i]").forEach(e=>{ e.textContent=t(e.dataset.i); });
  document.querySelectorAll("[data-h]").forEach(e=>{ e.innerHTML=e.dataset.h==="help"?t("help",HELP_URL(),NANO_URL(),OSC_DICT):e.dataset.h==="dict_hint"?t("dict_hint",OSC_DICT):t(e.dataset.h); });
  document.querySelectorAll("[data-p]").forEach(e=>{ e.placeholder=t(e.dataset.p); });
  document.querySelectorAll("[data-a]").forEach(e=>{ e.setAttribute("aria-label",t(e.dataset.a)); });
  renderDoc();
  const lb=document.getElementById("lang"); lb.textContent=t("lang_btn"); lb.setAttribute("aria-label",t("lang_aria")); lb.lang=LANG==="fr"?"en":"fr";
  updateCustomValue(); setSaved(true); applyUI();
}
function setLang(l){ LANG=l; try{ localStorage.setItem("nano-eos-lang",l); }catch(e){}
  const u=new URL(location.href); u.searchParams.set("lang",l); history.replaceState(null,"",u);
  applyStatic(); setPick(null); changedAll(); }

// Un modele ne regle que les faders et leurs S / M / R.
// Fader Wing regle aussi les potentiometres 7-8 (faders Eos 9-10) ; les potentiometres 1-6 ne sont jamais touches.
function presetStrips(kind,start){
  const s=Math.max(1,parseInt(start)||1), faders=[], smr=[];
  for(let i=0;i<8;i++){
    if(kind==="wing"){ faders.push({t:"fader",n:i+1}); }
    else faders.push({t:kind==="subs"?"sub":"chan",n:s+i});
    const d=BEH_DEFAULT[faders[i].t]; smr.push({S:{b:d[0]},M:{b:d[1]},R:{b:d[2]}});
  }
  return {faders,smr};
}

// ---------- notifications et annulation ----------
let undoSnap=null, toastTimer=null;
function toast(msg,action){
  const tt=document.getElementById("toast"), m=document.getElementById("toastmsg");
  tt.querySelectorAll("button").forEach(b=>b.remove()); m.textContent=msg; tt.classList.add("show");
  if(action){ const b=document.createElement("button"); b.type="button"; b.textContent=action.label; b.onclick=()=>{ action.fn(); }; tt.append(b); }
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>tt.classList.remove("show"),action?8000:3500);
}
// action destructive : on garde l'etat precedent et on propose "Annuler"
function undoable(msg,mutate){
  undoSnap=JSON.stringify(cfg); mutate(); changedAll();
  toast(msg,{label:t("undo"),fn:()=>{ if(!undoSnap) return; cfg=JSON.parse(undoSnap); undoSnap=null; openStrip=null; changedAll(); toast(t("undone")); }});
}

function targetLabel(ty,n,lang=LANG){ return ty==="none"?tl(lang,"free"):tl(lang,"tl_"+ty)+n; }
function paramName(p,lang=LANG){ return PARAMS.includes(p)?tl(lang,"p_"+p):(p||"?"); }
function knobLabel(k,lang=LANG){
  if(k.m==="rel") return paramName(k.p,lang)+(k.p==="intens"?"":k.w==="fine"?tl(lang,"p_fine"):"")+" ×"+Math.abs(k.k)+(k.k<0?" ⇄":"");
  return targetLabel(k.m,k.n,lang);
}
function behLabel(strip,slot){
  const b=cfg.smr[strip][slot]; if(b.b==="fn") return fnLabel(fnById(b.id));
  if(b.b==="none") return t("free");
  if(b.b==="flash"||b.b==="fire") return b.b==="flash"?(cfg.faders[strip].t==="sub"?"Bump":"Flash"):"Fire";
  return behName(b.b,cfg.faders[strip].t);
}

function setPick(id){

  const bar=document.getElementById("pickbar");

// ---------- bibliotheque : onglets, recherche, fonctions deja utilisees ----------
let libTab="all";
const norm=x=>String(x||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
// ou chaque fonction est utilisee : { id: ["▶ Play","S3",…] }
function usage(){ const u={}; const add=(id,w)=>{ (u[id]=u[id]||[]).push(w); };
  Object.keys(cfg.buttons).forEach(cc=>add(cfg.buttons[cc],BTN_LABEL[cc]));
  cfg.smr.forEach((s,i)=>["S","M","R"].forEach(sl=>{ if(s[sl].b==="fn") add(s[sl].id,sl+(i+1)); })); return u; }
const fnDesc=f=>L(f.d)||((f.type==="cmd"?t("chip_cmd"):t("chip_osc"))+f.value);
function setDesc(txt){ document.getElementById("libdesc").textContent=txt||t("lib_hint"); }
// fait clignoter sur le nano les boutons et cases qui portent la fonction
function findOnNano(id){
  const els=[...document.querySelectorAll(".target")].filter(x=>cfg.buttons[x.dataset.cc]===id)
    .concat([...document.querySelectorAll(".slot")].filter(b=>{ const c=cfg.smr[b.dataset.strip][b.dataset.slot]; return c.b==="fn"&&c.id===id; }));
  els.forEach(e=>{ e.classList.remove("found"); void e.offsetWidth; e.classList.add("found"); });
  if(els.length){ const r=els[0].getBoundingClientRect(); if(r.top<0||r.bottom>innerHeight) els[0].scrollIntoView({behavior:"smooth",block:"center"}); }
}
function chip(f,use){
  const el=document.createElement("div"); el.className="chip "+f.type; el.draggable=true; el.tabIndex=0; el.dataset.id=f.id;
  el.setAttribute("role","button"); el.setAttribute("aria-pressed",selected===f.id?"true":"false");
  el.append(L(f.label));
  if(f.tag){ const g=document.createElement("span"); g.className="ctag"; g.textContent=L(f.tag); el.append(g); }
  const where=use[f.id]||[];
  if(where.length){ el.classList.add("used"); if(where.length>1) el.classList.add("dup");
    const b=document.createElement("span"); b.className="badge"; b.textContent=where.length>1?"×"+where.length:"✓"; el.append(b); }
  if(f.custom){ el.classList.add("hasx"); el.append(xButton(t("x_title",fnLabel(f)),()=>deleteCustom(f.id))); }
  const info=fnDesc(f)+(where.length?" — "+t("used_on",where.join(", ")):"");
  el.title=info; el.setAttribute("aria-description",info);
  el.addEventListener("mouseenter",()=>setDesc(info)); el.addEventListener("focus",()=>setDesc(info));
  el.addEventListener("mouseleave",()=>setDesc()); el.addEventListener("blur",()=>setDesc());
  el.addEventListener("dragstart",e=>e.dataTransfer.setData("text/plain","fn:"+f.id));
  const pick=()=>{ setPick(selected===f.id?null:f.id); if(where.length) findOnNano(f.id); };
  el.addEventListener("click",pick);
  el.addEventListener("keydown",e=>{ if(e.key==="Enter"||e.key===" "){e.preventDefault();pick();}
    if(f.custom&&(e.key==="Delete"||e.key==="Backspace")){ e.preventDefault(); deleteCustom(f.id); } });
  if(selected===f.id) el.classList.add("sel");
  return el;
}
// supprime une fonction personnalisee et la retire des boutons et cases qui la portent (annulable)
function deleteCustom(id){
  const f=cfg.custom.find(x=>x.id===id); if(!f) return; const n=(usage()[id]||[]).length;
  if(selected===id) setPick(null);
  undoable(n?tn("custom_deleted_used",n,f.label):t("custom_deleted",f.label),()=>{
    cfg.custom=cfg.custom.filter(x=>x.id!==id);
    Object.keys(cfg.buttons).forEach(cc=>{ if(cfg.buttons[cc]===id) delete cfg.buttons[cc]; });
    cfg.smr.forEach(s=>["S","M","R"].forEach(sl=>{ if(s[sl].b==="fn"&&s[sl].id===id) s[sl]={b:"none"}; }));
  });
}
const keyId=k=>k==="all"?"all":k==="__custom"?"custom":String(GROUPS.indexOf(k));
function renderTabs(){
  const box=document.getElementById("lib-tabs"), keys=["all",...GROUPS,"__custom"];
  box.replaceChildren(...keys.map(k=>{ const b=document.createElement("button"); b.type="button"; b.setAttribute("role","tab"); b.dataset.tab=k; b.id="tab-"+keyId(k);
    const sel=libTab===k; b.setAttribute("aria-selected",sel?"true":"false"); b.tabIndex=sel?0:-1; b.setAttribute("aria-controls","lib-panel");
    b.append(k==="all"?t("tab_all"):k==="__custom"?t("g_custom"):t("g_"+k));
    const n=k==="all"?null:(k==="__custom"?cfg.custom.length:LIB.filter(f=>f.g===k).length);
    if(n!==null){ const c=document.createElement("span"); c.className="n"; c.textContent=n; b.append(c); }
    b.onclick=()=>{ libTab=k; document.getElementById("lib-search").value=""; renderLib(); };
    b.onkeydown=e=>{ const d=e.key==="ArrowRight"?1:e.key==="ArrowLeft"?-1:0; if(!d) return; e.preventDefault();
      libTab=keys[(keys.indexOf(k)+d+keys.length)%keys.length]; renderLib(); document.querySelector('#lib-tabs [data-tab="'+CSS.escape(libTab)+'"]').focus(); };
    return b; }));
}
function renderLib(){
  const fid=document.activeElement&&document.activeElement.classList.contains("chip")?document.activeElement.dataset.id:null;
  const q=norm(document.getElementById("lib-search").value.trim()), use=usage();
  const match=f=>!q||[fnLabel(f),fnDesc(f),f.value].some(x=>norm(x).includes(q));
  const tab=q?"all":libTab;
  renderTabs();
  const box=document.getElementById("libs"); box.replaceChildren(); box.className=tab==="all"?"all":"";
  const row=(label,list,note)=>{ const r=document.createElement("div"); r.className="grow";
    if(label){ const l=document.createElement("span"); l.className="gl"; l.textContent=label; r.append(l); }
    r.append(...list.map(f=>chip(f,use)));
    if(note){ const n=document.createElement("span"); n.className="gnote"; n.textContent=t(note); r.append(n); } return r; };

// ---------- navigation clavier : un seul arret Tab par groupe, puis fleches ----------
const rovMem={};
// grid=false : liste (gauche/droite et haut/bas = precedent/suivant) ; grid=true : lignes data-row / colonnes data-col
function roving(container,sel,key,grid){
  const items=()=>[...container.querySelectorAll(sel)];
  const id=e=>grid?e.dataset.row+","+e.dataset.col:(e.dataset.id||e.dataset.cc);
  const apply=()=>{ const l=items(); if(!l.length) return; const cur=l.find(e=>id(e)===rovMem[key])||l[0]; l.forEach(e=>{ e.tabIndex=e===cur?0:-1; }); };
  if(!container.dataset.rov){ container.dataset.rov="1";
    container.addEventListener("focusin",e=>{ const el=e.target.closest(sel); if(!el||!container.contains(el)) return; rovMem[key]=id(el); items().forEach(x=>{ x.tabIndex=x===el?0:-1; }); });
    container.addEventListener("keydown",e=>{ const el=e.target; if(!el.matches||!el.matches(sel)) return;
      const l=items(); let n=null;
      if(grid){ const r=+el.dataset.row, c=+el.dataset.col, d={ArrowLeft:[0,-1],ArrowRight:[0,1],ArrowUp:[-1,0],ArrowDown:[1,0]}[e.key]; if(!d) return;
        n=l.find(x=>+x.dataset.row===r+d[0]&&+x.dataset.col===c+d[1]); }
      else { const i=l.indexOf(el), d={ArrowLeft:-1,ArrowUp:-1,ArrowRight:1,ArrowDown:1}[e.key];
        if(e.key==="Home") n=l[0]; else if(e.key==="End") n=l[l.length-1]; else if(d) n=l[(i+d+l.length)%l.length]; else return; }
      e.preventDefault(); if(n) n.focus(); }); }
  apply();
}

// ---------- regles ----------
function checkRules(){
  const out=[], seen={};
  const reg=(key,where)=>{ (seen[key]=seen[key]||[]).push(where); };
  cfg.faders.forEach((f,i)=>{ if(f.t!=="none") reg(f.t+":"+f.n,t("w_fader",i+1)); });
  cfg.knobs.forEach((k,i)=>{ if(k.m!=="rel"&&k.m!=="none") reg(k.m+":"+k.n,t("w_knob",i+1)); });
  for(const k in seen) if(seen[k].length>1){ const [ty,n]=k.split(":"); out.push(["warn",t("r_dup",targetLabel(ty,n),seen[k].join(", "))]); }
  cfg.knobs.forEach((k,i)=>{ if(k.m==="rel"&&!k.p) out.push(["err",t("r_param",i+1)]); });
  const usesBank=cfg.faders.some(f=>f.t==="fader")||cfg.knobs.some(k=>k.m==="fader");
  const vals=Object.values(cfg.buttons);
  const pg=["pageup","pagedown"];
  if(usesBank && !pg.some(x=>vals.includes(x))) out.push(["info",t("r_tip")]);
  if(pg.some(x=>vals.includes(x))&&!pg.every(x=>vals.includes(x))) out.push(["warn",t("r_pair")]);
  if(pg.some(x=>vals.includes(x))) out.push(["info",t("r_pages")]);
  if(!usesBank && pg.some(x=>vals.includes(x))) out.push(["warn",t("r_nobank")]);
  cfg.smr.forEach((s,i)=>["S","M","R"].forEach(sl=>{
    if(s[sl].b==="fn"&&!fnById(s[sl].id)) out.push(["err",t("r_missing",sl,i+1)]);
    else if(!available(i,s[sl].b)) out.push(["warn",t("r_na",sl,i+1,behName(s[sl].b,"fader"),t("tn_"+cfg.faders[i].t))]); }));
  const ne=out.filter(r=>r[0]==="err").length, nw=out.filter(r=>r[0]==="warn").length, rc=document.getElementById("rules-count");
  rc.hidden=!(ne||nw); rc.className="link "+(ne?"err":"warn"); rc.textContent=ne?tn("rules_err",ne):tn("rules_warn",nw);
  const ul=document.getElementById("rules"); ul.replaceChildren(...out.map(([c,txt])=>{ const li=document.createElement("li"); li.className=c; li.textContent=(c==="err"?t("r_err"):"")+txt; return li; }));
  return out;
}

// ---------- generation Chataigne (noms toujours en francais, comme le projet du depot) ----------
const clone=o=>JSON.parse(JSON.stringify(o));
const midi=cc=>"/modules/midi/values/_1_CC"+cc;
// noms ASCII uniquement (Chataigne derive des adresses internes des noms)
const ascii=x=>String(x).normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/×/g,"x").replace(/[−–—]/g,"-").replace(/[^\x20-\x7E]/g,"");
function keyAction(name,cc,addr){ const a=clone(TPL.keyAction); a.niceName=ascii(name); a.conditions.items[0].parameters[0].value=midi(cc); a.consequences.items[0].command.parameters[0].value=addr; return a; }
function cmdAction(name,cc,text){ const a=clone(TPL.cmdAction); a.niceName=ascii(name); a.conditions.items[0].parameters[0].value=midi(cc);
  const arg=a.consequences.items[0].command.argManager.items[0]; arg.parameters[0].value=text; arg.param.value=text; return a; }
function flashAction(name,cc,addr){ const a=clone(TPL.flashAction); a.niceName=ascii(name); a.conditions.items[0].parameters[0].value=midi(cc);
  a.consequences.items[0].command.parameters[0].value=addr; a.consequencesOff.items[0].command.parameters[0].value=addr; return a; }
function fnAction(name,cc,f){
  if(f.multi){ const a=keyAction(name,cc,f.multi[0]); const c0=a.consequences.items[0];
    a.consequences.items=f.multi.map((addr,i)=>{ const c=clone(c0); c.niceName="Consequence "+(i+1); c.command.parameters[0].value=addr; return c; }); return a; }
  return f.type==="key"?keyAction(name,cc,f.value):cmdAction(name,cc,f.value); }
function mapping(name,cc,ty,n){
  const m=clone(TPL.mapping); m.niceName=ascii(name); m.im.items[0].parameters[0].value=midi(cc);
  const tg=m.filters.items[0].filterParams.parameters.find(p=>p.controlAddress==="/targetMin_Max");
  tg.value=ty==="chan"?[0.0,100.0]:[0.0,1.0];
  m.outputs.items[0].command.parameters[0].value=faderAddr(ty,n);
  return m;
}
function smrAction(i,slot){
  const b=cfg.smr[i][slot], cc=CC[slot](i), fa=cfg.faders[i], name=slot+(i+1)+" - ";
  if(b.b==="none"||!available(i,b.b)) return null;
  if(b.b==="fn"){ const f=fnById(b.id); return f?fnAction(name+fnLabel(f,"fr"),cc,f):null; }
  const lab=name+behName(b.b,fa.t,"fr").toUpperCase()+" "+targetLabel(fa.t,fa.n,"fr").toUpperCase();
  if(fa.t==="fader"){ const base="/eos/fader/1/"+fa.n; return b.b==="flash"?flashAction(lab,cc,base+"/fire"):keyAction(lab,cc,base+"/"+b.b); }
  if(fa.t==="sub"){ const base="/eos/sub/"+fa.n; return b.b==="flash"?flashAction(lab,cc,base+"/fire"):keyAction(lab,cc,base+"/"+b.b); }
  if(fa.t==="chan"){ return cmdAction(lab,cc,b.b==="full"?"Chan "+fa.n+" Full #":b.b==="out"?"Chan "+fa.n+" Out #":"Chan "+fa.n+" #"); }
  return null;
}
// position et taille dans la State Machine (meme disposition que le projet du depot)
function state(name,x,y,w,items){ const s=clone(TPL.state); s.niceName=name;
  const set=(addr,v)=>{ const q=s.parameters.find(p=>p.controlAddress===addr); if(q) q.value=v; else s.parameters.push({value:v,controlAddress:addr}); };
  set("/viewUIPosition",[x,y]); set("/viewUISize",[w,Math.max(96,60+items.length*28)]);
  s.processors.items=items; return s; }

function buildScript(){
  const rel=cfg.knobs.map((k,i)=>({k,i})).filter(o=>o.k.m==="rel"); if(!rel.length) return null;
  let s="// Genere par le configurateur nanoKONTROL2 -> ETC Eos\n// Potentiometres en roue : crans de roue Eos par cran de potentiometre (negatif = sens inverse).\n";
  rel.forEach(o=>{ s+="var last"+CC.knob(o.i)+" = -1;\n"; });
  s+="\nfunction step(last, value) { return (last >= 0) ? value - last : 0; }\nfunction wheel(address, ticks) { if (ticks != 0) root.modules.osc.send(address, ticks); }\n\nfunction ccEvent(channel, number, value) {\n";
  rel.forEach((o,j)=>{ const cc=CC.knob(o.i), k=o.k, addr=k.p==="intens"?"/eos/wheel/level":"/eos/wheel/"+k.w+"/"+k.p;
    s+="  "+(j?"} else ":"")+"if (number == "+cc+") {   // potentiometre "+(o.i+1)+" : "+ascii(knobLabel(k,"fr"))+"\n    wheel(\""+addr+"\", step(last"+cc+", value) * "+k.k+");\n    last"+cc+" = value;\n"; });
  s+="  }\n}\n"; return s;
}
function buildProject(){
  const p=clone(TPL.project), script=buildScript();
  const faders=[], smr=[], keys=[];
  cfg.faders.forEach((f,i)=>{ if(f.t!=="none") faders.push(mapping("FADER "+(i+1)+" - "+targetLabel(f.t,f.n,"fr").toUpperCase(),CC.fader(i),f.t,f.n)); });
  cfg.knobs.forEach((k,i)=>{ if(k.m!=="rel"&&k.m!=="none") faders.push(mapping("POTENTIOMETRE "+(i+1)+" - "+targetLabel(k.m,k.n,"fr").toUpperCase(),CC.knob(i),k.m,k.n)); });
  for(let i=0;i<8;i++) for(const sl of ["S","M","R"]){ const a=smrAction(i,sl); if(a) smr.push(a); }
  // boutons dans l'ordre physique du nano : Track, Cycle / Set / Marker, transport
  BTN_ORDER.forEach(cc=>{ const f=fnById(cfg.buttons[cc]); if(f&&!f.script) keys.push(fnAction(BTN_NAME[cc]+" - "+fnLabel(f,"fr"),cc,f)); });
  p.states.items.push(state("TOUCHES NANO > EOS",-1010,-474,452,keys),state("FADERS",-548,-474,456,faders),state("S / M / R",-82,-474,445,smr));
  p.modules.items.forEach(m=>{ if(m.type==="MIDI"&&m.scripts&&m.scripts.items){
    if(script){ m.scripts.items.forEach(sc=>{ sc.niceName="encodeurs-relatifs"; sc.parameters.forEach(q=>{ if(q.controlAddress==="/filePath") q.value="encodeurs-relatifs.js"; }); }); }
    else m.scripts.items=[]; } });
  return {project:p,script,count:faders.length+smr.length+keys.length};
}

// ---------- zip (sans compression, sans bibliotheque) ----------
const CRC_T=(()=>{ const x=new Uint32Array(256); for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c=c&1?0xEDB88320^(c>>>1):c>>>1; x[n]=c>>>0; } return x; })();
function crc32(b){ let c=0xFFFFFFFF; for(let i=0;i<b.length;i++) c=CRC_T[(c^b[i])&255]^(c>>>8); return (c^0xFFFFFFFF)>>>0; }
function makeZip(files){
  const enc=new TextEncoder(), parts=[], central=[]; let off=0;
  const d=new Date(), time=(d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1), date=((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate();
  for(const f of files){
    const name=enc.encode(f.name), data=enc.encode(f.text), crc=crc32(data);
    const h=new DataView(new ArrayBuffer(30));
    h.setUint32(0,0x04034b50,true); h.setUint16(4,20,true); h.setUint16(6,0x0800,true); h.setUint16(8,0,true); h.setUint16(10,time,true); h.setUint16(12,date,true);
    h.setUint32(14,crc,true); h.setUint32(18,data.length,true); h.setUint32(22,data.length,true); h.setUint16(26,name.length,true); h.setUint16(28,0,true);
    parts.push(h,name,data);
    const c=new DataView(new ArrayBuffer(46));
    c.setUint32(0,0x02014b50,true); c.setUint16(4,20,true); c.setUint16(6,20,true); c.setUint16(8,0x0800,true); c.setUint16(10,0,true); c.setUint16(12,time,true); c.setUint16(14,date,true);
    c.setUint32(16,crc,true); c.setUint32(20,data.length,true); c.setUint32(24,data.length,true); c.setUint16(28,name.length,true); c.setUint32(42,off,true);
    central.push(c,name); off+=30+name.length+data.length;
  }
  const size=central.reduce((s,x)=>s+x.byteLength,0), e=new DataView(new ArrayBuffer(22));
  e.setUint32(0,0x06054b50,true); e.setUint16(8,files.length,true); e.setUint16(10,files.length,true); e.setUint32(12,size,true); e.setUint32(16,off,true);
  return new Blob([...parts,...central,e],{type:"application/zip"});
}
function readme(hasScript){ return I18N[LANG].readme.join("\r\n").split("{0}").join(hasScript?t("readme_s"):"").split("{1}").join(HELP_URL()); }
function download(name,data,type){ const blob=data instanceof Blob?data:new Blob([data],{type}); const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; document.body.append(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),2000); }
function exportProject(){
  const errs=checkRules().filter(r=>r[0]==="err");
  if(errs.length){ toast(t("exp_blocked",errs.length)); document.getElementById("rules").scrollIntoView({behavior:"smooth",block:"center"}); return; }
  const r=buildProject(), dir="nanoKONTROL2-EOS/";
  const files=[{name:dir+"nanoKONTROL2-EOS.noisette",text:JSON.stringify(r.project)},{name:dir+"nanokontrol2-config.json",text:JSON.stringify(cfg,null,1)},{name:dir+t("readme_name"),text:readme(!!r.script)}];
  if(r.script) files.splice(1,0,{name:dir+"encodeurs-relatifs.js",text:r.script});
  download("nanoKONTROL2-EOS.zip",makeZip(files));
  const d=document.getElementById("done");
  d.innerHTML="<h3>"+t("done_title",r.count)+"</h3><ol><li>"+t("done_1",r.script?t("done_1s"):"")+"</li><li>"+t("done_2")+"</li><li>"+t("done_3")+"</li><li>"+t("done_4",HELP_URL())+"</li></ol>";
  d.classList.add("show"); d.focus();
  toast(t("export_done"),{label:t("export_see"),fn:()=>{ d.scrollIntoView({behavior:"smooth",block:"center"}); d.focus(); }});
}
